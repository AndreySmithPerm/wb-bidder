<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — wb-bidder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- Шапка -->
    <header class="bg-white shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-xl font-extrabold text-purple-600">🚀 wb-bidder</h1>
            <div class="flex items-center gap-4">
                <span id="subStatus" class="text-sm text-slate-600">Загрузка статуса...</span>
                <button onclick="logout()" class="px-4 py-2 text-sm font-bold text-white bg-slate-700 rounded-lg hover:bg-slate-800 transition cursor-pointer">Выйти</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Левая колонка: тариф и покупка -->
        <section class="lg:col-span-1 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm p-6">
                <h2 class="text-lg font-bold text-slate-800 mb-2">Тариф</h2>
                <p class="text-slate-500 text-sm mb-1">Стоимость подписки в месяц:</p>
                <p class="text-4xl font-extrabold text-purple-600 mb-1">
                    <span id="cabinetPrice">2 990</span>
                    <span class="text-base font-medium text-slate-400">руб.</span>
                </p>
                <button id="buySubBtn"
                        class="w-full mt-4 py-3 text-sm font-bold text-white bg-purple-600 rounded-lg hover:bg-purple-700 transition cursor-pointer">
                    Оплатить подписку
                </button>
            </div>
        </section>

        <!-- Правая часть: форма кампании и логи -->
        <section class="lg:col-span-2 space-y-6">

            <!-- Форма добавления кампании -->
            <div class="bg-white rounded-2xl shadow-sm p-6">
                <h2 class="text-lg font-bold text-slate-800 mb-4">Новая АРК-кампания</h2>

                <!-- Переключатель: Токен / OAuth -->
                <div class="flex gap-2 mb-4 bg-slate-100 p-1 rounded-lg w-fit">
                    <div id="tabToken"
                         class="py-2 px-4 text-xs font-bold rounded-lg transition bg-white text-purple-600 shadow-sm cursor-pointer">
                        API-токен WB
                    </div>
                    <div id="tabOAuth"
                         class="py-2 px-4 text-xs font-bold rounded-lg transition text-slate-500 hover:text-purple-600 cursor-pointer">
                        OAuth 2.0
                    </div>
                </div>

                <form id="campaignForm">
                    <!-- Блок: ручной ввод токена -->
                    <div id="containerTokenInput" class="mb-4">
                        <label class="block text-xs font-bold text-slate-500 mb-1" for="wbToken">API-токен Wildberries</label>
                        <input id="wbToken" type="password" required
                               placeholder="eyJhbGciOi..."
                               class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-purple-500">
                    </div>

                    <!-- Блок: OAuth -->
                    <div id="containerOAuthInput" class="mb-4 hidden">
                        <button type="button" id="wbOAuthBtn"
                                class="w-full py-2 text-xs font-bold text-purple-600 border border-purple-200 rounded-lg hover:bg-purple-50 transition cursor-pointer">
                            Подключиться через Wildberries (OAuth)
                        </button>
                        <!-- Скрытый сигнал успешной OAuth-авторизации -->
                        <input type="hidden" id="oauthConnectedSignal" value="">
                    </div>

                    <!-- Поля кампании -->
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1" for="campId">ID кампании</label>
                            <input id="campId" type="number"
                                   class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-purple-500" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1" for="keyword">Ключевая фраза</label>
                            <input id="keyword" type="text"
                                   placeholder="например: чехол для iphone"
                                   class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-purple-500" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1" for="targetPlace">Целевая позиция</label>
                            <input id="targetPlace" type="number" min="1"
                                   class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-purple-500" required>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1" for="minBid">Мин. ставка</label>
                                <input id="minBid" type="number" min="0"
                                       class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-purple-500" required>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1" for="maxBid">Макс. ставка</label>
                                <input id="maxBid" type="number" min="0"
                                       class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-purple-500" required>
                            </div>
                        </div>
                    </div>

                    <button type="submit"
                            class="w-full py-3 text-sm font-bold text-white bg-emerald-500 rounded-lg hover:bg-emerald-600 transition cursor-pointer">
                        Добавить кампанию
                    </button>
                </form>
            </div>

            <!-- Таблица логов -->
            <div class="bg-white rounded-2xl shadow-sm p-6">
                <h2 class="text-lg font-bold text-slate-800 mb-4">История работы воркеров</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="border-b border-purple-100 text-xs text-slate-400 uppercase">
                                <th class="p-3">Кампания</th>
                                <th class="p-3">Событие</th>
                                <th class="p-3">Новая ставка</th>
                                <th class="p-3">Ставки рынка</th>
                                <th class="p-3">Статус</th>
                            </tr>
                        </thead>
                        <tbody id="campaignsTable">
                            <tr>
                                <td colspan="5" class="p-3 text-center text-slate-400">Загрузка истории проверок...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <!-- Логика скриптов личного кабинета -->
    <script>
        // Защита: без JWT сразу отправляем на страницу входа
        if (!localStorage.getItem('jwt_token')) {
            window.location.href = '/auth.html';
        }

        function logout() {
            localStorage.removeItem('jwt_token');
            window.location.href = '/auth.html';
        }

        const campaignForm = document.getElementById('campaignForm');
        const buySubBtn = document.getElementById('buySubBtn');
        const tabToken = document.getElementById('tabToken');
        const tabOAuth = document.getElementById('tabOAuth');
        const containerTokenInput = document.getElementById('containerTokenInput');
        const containerOAuthInput = document.getElementById('containerOAuthInput');
        const wbTokenInput = document.getElementById('wbToken');

        let activeMethod = 'token';

        // Переключение вкладок интеграции (Токен / OAuth)
        if (tabToken && tabOAuth) {
            tabToken.addEventListener('click', () => {
                activeMethod = 'token';
                tabToken.className = "py-2 px-4 text-xs font-bold rounded-lg transition bg-white text-purple-600 shadow-sm cursor-pointer";
                tabOAuth.className = "py-2 px-4 text-xs font-bold rounded-lg transition text-slate-500 hover:text-purple-600 cursor-pointer";
                if (containerTokenInput) containerTokenInput.classList.remove('hidden');
                if (containerOAuthInput) containerOAuthInput.classList.add('hidden');
                if (wbTokenInput) wbTokenInput.required = true;
            });

            tabOAuth.addEventListener('click', () => {
                activeMethod = 'oauth';
                tabOAuth.className = "py-2 px-4 text-xs font-bold rounded-lg transition bg-white text-purple-600 shadow-sm cursor-pointer";
                tabToken.className = "py-2 px-4 text-xs font-bold rounded-lg transition text-slate-500 hover:text-purple-600 cursor-pointer";
                if (containerOAuthInput) containerOAuthInput.classList.remove('hidden');
                if (containerTokenInput) containerTokenInput.classList.add('hidden');
                if (wbTokenInput) wbTokenInput.required = false;
            });
        }

        // Клик по кнопке OAuth (имитация авторизации через шлюз WB)
        const wbOAuthBtn = document.getElementById('wbOAuthBtn');
        if (wbOAuthBtn) {
            wbOAuthBtn.addEventListener('click', () => {
                alert('Запуск OAuth: Перенаправление на шлюз Wildberries...');
                const mockOauthSignal = document.getElementById('oauthConnectedSignal');
                if (mockOauthSignal) mockOauthSignal.value = "oauth_success_test_callback_token";
                alert('Упрощённое подключение по протоколу OAuth 2.0 выполнено!');
            });
        }

        // Получение актуальной цены подписки из БД
        async function fetchCabinetPrice() {
            const priceEl = document.getElementById('cabinetPrice');
            if (!priceEl) return;
            try {
                const response = await fetch('/api/public/price');
                if (response.ok) {
                    const data = await response.json();
                    priceEl.innerText = data.price.toLocaleString('ru-RU');
                }
            } catch (err) {
                priceEl.innerText = '2 990';
            }
        }
        fetchCabinetPrice();

// Проверка разрешенных протоколов администратором (по умолчанию в БД — 'manual')
async function checkAllowedAuthProtocol() {
    const token = localStorage.getItem('jwt_token');
    if (!token) return;

    // OAuth скрыт сразу: показываем только если разрешено в БД
    if (tabOAuth) tabOAuth.classList.add('hidden');

    try {
        const response = await fetch('/api/user/profile', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) return; // ошибка/нет токена — OAuth остаётся скрытым

        const user = await response.json();
        const proto = user.allowed_auth_protocol || 'manual';

        if (proto === 'oauth') {
            if (tabToken) tabToken.classList.add('hidden');
            if (tabOAuth) {
                tabOAuth.classList.remove('hidden');
                tabOAuth.click(); // сразу активируем OAuth-вкладку
            }
        } else if (proto === 'both') {
            if (tabOAuth) tabOAuth.classList.remove('hidden');
        } else {
            // 'manual' — только токен, OAuth недоступен
            if (tabToken) tabToken.click();
        }
    } catch (err) {
        console.error("Ошибка верификации протоколов доступа:", err);
    }
}

        // Вебхук оплаты подписки
        if (buySubBtn) {
            buySubBtn.addEventListener('click', async () => {
                try {
                    const response = await fetch('/api/payments/webhook', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: 1, status: "succeeded", amount: 2990 })
                    });
                    if (response.ok) {
                        alert('Оплата успешна! Подписка продлена.');
                        window.location.reload();
                    }
                } catch (err) {
                    alert('Ошибка сети');
                }
            });
        }

        // Добавление АРК кампании под защитой JWT
        if (campaignForm) {
            campaignForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const token = localStorage.getItem('jwt_token');

                let finalWbToken = "";
                if (activeMethod === 'token') {
                    finalWbToken = document.getElementById('wbToken').value;
                } else {
                    finalWbToken = document.getElementById('oauthConnectedSignal').value || "mock_oauth_token_session";
                }

                const bodyData = {
                    id: parseInt(document.getElementById('campId').value),
                    wb_token: finalWbToken,
                    connection_type: activeMethod,
                    keyword: document.getElementById('keyword').value,
                    target_place: parseInt(document.getElementById('targetPlace').value),
                    max_bid: parseInt(document.getElementById('maxBid').value),
                    min_bid: parseInt(document.getElementById('minBid').value)
                };
                try {
                    const response = await fetch('/api/campaigns', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(bodyData)
                    });
                    if (response.ok) {
                        alert('Кампания успешно добавлена!');
                        campaignForm.reset();
                        if (activeMethod === 'oauth') {
                            document.getElementById('oauthConnectedSignal').value = "";
                        }
                        loadCampaignLogs(bodyData.id);
                    } else {
                        const data = await response.json();
                        alert('Ошибка: ' + data.error);
                    }
                } catch (err) {
                    alert('Ошибка сети при отправке данных в Go');
                }
            });
        }

        // Загрузка логов изменений ставок воркерами из PostgreSQL
        async function loadCampaignLogs(campaignId) {
            const token = localStorage.getItem('jwt_token');
            const tbody = document.getElementById('campaignsTable');
            if (!tbody) return;
            try {
                const response = await fetch(`/api/campaigns/${campaignId}/logs`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) return;
                const logs = await response.json();
                tbody.innerHTML = '';

                if (!logs || logs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-slate-400">Пока нет истории проверок</td></tr>`;
                    return;
                }
                logs.forEach(log => {
                    const date = new Date(log.created_at).toLocaleTimeString('ru-RU', {
                        hour: '2-digit', minute: '2-digit', second: '2-digit'
                    });
                    const marketDisplay = (log.market_bids && log.market_bids.length > 0)
                        ? `[${log.market_bids.slice(0,4).join(', ')}...]`
                        : '[150, 150, 150...]';
                    tbody.innerHTML += `
                        <tr class="border-b border-purple-50 hover:bg-purple-50/50 transition">
                            <td class="p-3 font-semibold text-slate-600">№ ${campaignId} <span class="text-xs text-slate-400 block mt-0.5">${date}</span></td>
                            <td class="p-3 text-slate-800 font-medium">${log.status_message}</td>
                            <td class="p-3 font-extrabold text-purple-600 text-base">${log.new_bid} руб.</td>
                            <td class="p-3 font-mono text-xs text-slate-500">${marketDisplay}</td>
                            <td class="p-3"><span class="px-2.5 py-1 text-xs font-bold rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">В работе</span></td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Ошибка обновления дашборда");
            }
        }

        // Вывод реального статуса подписки и лимитов из базы данных
        async function loadSubscriptionStatus() {
            const token = localStorage.getItem('jwt_token');
            const subStatus = document.getElementById('subStatus');
            if (!subStatus) return;
            try {
                const response = await fetch('/api/user/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) return;

                const profile = await response.json();
                const expires = new Date(profile.expires_at).toLocaleDateString('ru-RU');
                const limit = profile.campaign_limit;
                const isTrial = limit <= 5;

                if (isTrial) {
                    subStatus.innerHTML =
                        `Режим: <span class="text-amber-600 font-bold">Пробный период</span> (До: ${expires}). Лимит кампаний: <span class="font-bold">${limit}</span>.`;
                } else {
                    subStatus.innerHTML =
                        `Режим: <span class="text-emerald-600 font-bold">Премиум подписка</span> (Активна до: ${expires}). Лимит: ${limit} кампаний.`;
                }
            } catch (err) {
                console.error("Ошибка загрузки профиля");
            }
        }

        // Фоновый автоматический опрос логов и статуса профиля
        if (localStorage.getItem('jwt_token')) {
            loadCampaignLogs(554433);
            loadSubscriptionStatus();

            setInterval(loadSubscriptionStatus, 30000);
            setInterval(() => loadCampaignLogs(554433), 10000);
        }
    </script>
</body>
</html>
