<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Установка нового пароля — WB-Bidder</title>
    <link rel="stylesheet" href="/css/tailwind.min.css">
    <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
  </head>
  <body class="bg-purple-50 text-slate-900 antialiased min-h-screen flex flex-col justify-center items-center p-6">

    <div class="bg-white p-8 rounded-2xl shadow-md border border-purple-100 w-full max-w-md">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-extrabold text-slate-800 tracking-tight">Установка нового пароля</h2>
        <p class="text-xs text-slate-400 mt-1" id="emailDisplay">Для аккаунта: ...</p>
      </div>
      
      <form id="resetForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Новый пароль</label>
          <input type="password" id="newPassword" required minlength="6"
              class="w-full px-4 py-2.5 bg-purple-50/50 rounded-xl border border-purple-200 focus:outline-none focus:border-purple-500 focus:bg-white transition">
        </div>
        <button type="submit" 
            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition duration-200 cursor-pointer">
            Сохранить пароль
        </button>
      </form>
    </div>

    <script>
        // Достаем email селлера из параметров ссылки (Query String)
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        if (email) {
            document.getElementById('emailDisplay').innerText = `Для аккаунта: ${email}`;
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('newPassword').value;

            try {
                // Отправляем новый пароль на бэкенд (эндпоинт сохранения мы сделаем на следующем шаге при необходимости)
                const response = await fetch('/api/auth/save-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    alert('Пароль успешно изменен! Теперь вы можете войти в систему.');
                    window.location.href = '/'; // Редирект на главную страницу входа
                } else {
                    const data = await response.json();
                    alert('Ошибка: ' + (data.error || 'Не удалось сохранить пароль'));
                }
            } catch (err) {
                alert('Ошибка сети при связи с Go-сервером');
            }
        });
    </script>
  </body>
</html>
