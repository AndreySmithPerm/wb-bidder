<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход в WB-Bidder</title>
    <link rel="stylesheet" href="/css/tailwind.min.css">
    <style>
      body { 
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      }
    </style>
  </head>
  <body class="bg-purple-50 text-slate-900 antialiased min-h-screen flex flex-col justify-center items-center p-6">

    <div class="bg-white p-8 rounded-2xl shadow-md border border-purple-100 w-full max-w-md">
      <div class="text-center mb-8">
        <h2 id="authTitle" class="text-3xl font-extrabold text-[#1e293b] tracking-tight relative inline-block">
          Вход в платформу АРК
          <svg class="absolute left-0 bottom-[-8px] w-full h-1.5 text-purple-500 opacity-60" viewBox="0 0 300 12" fill="none" xmlns="http://w3.org" preserveAspectRatio="none">
            <path d="M3 9C50 3.5 120 2 297 7" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          </svg>
        </h2>
      </div>
      
      <form id="authForm" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Email</label>
          <input type="email" id="email" required 
              class="w-full px-4 py-2.5 bg-purple-50/50 rounded-xl border border-purple-200 focus:outline-none focus:border-purple-500 focus:bg-white transition">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Пароль</label>
          <input type="password" id="password" required 
              class="w-full px-4 py-2.5 bg-purple-50/50 rounded-xl border border-purple-200 focus:outline-none focus:border-purple-500 focus:bg-white transition">
        </div>
        <button type="submit" id="submitBtn" 
            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition duration-200 cursor-pointer">
            Войти
        </button>
      </form>

      <div class="text-center mt-6">
        <button id="toggleAuth" class="text-sm font-medium text-purple-600 hover:text-purple-800 underline transition cursor-pointer">
            Нет аккаунта? Зарегистрироваться
        </button>
      </div>
    </div>
    <!-- Логика скриптов авторизации -->
    <script>
        const authForm = document.getElementById('authForm');
        const authTitle = document.getElementById('authTitle');
        const submitBtn = document.getElementById('submitBtn');
        const toggleAuth = document.getElementById('toggleAuth');
        let isLogin = true;

        // Полностью валидные и чистые SVG-строки с корректными адресами XML-схем
        const loginSvg = '<svg class="absolute left-0 bottom-[-8px] w-full h-1.5 text-purple-500 opacity-60" viewBox="0 0 300 12" fill="none" xmlns="http://w3.org" preserveAspectRatio="none"><path d="M3 9C50 3.5 120 2 297 7" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>';
        const registerSvg = '<svg class="absolute left-0 bottom-[-8px] w-full h-1.5 text-purple-500 opacity-60" viewBox="0 0 300 12" fill="none" xmlns="http://w3.org" preserveAspectRatio="none"><path d="M3 9C50 3.5 120 2 297 7" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>';

        toggleAuth.addEventListener('click', () => {
            isLogin = !isLogin;
            authTitle.innerHTML = isLogin ? 'Вход в платформу АРК ' + loginSvg : 'Регистрация селлера ' + registerSvg;
            submitBtn.innerText = isLogin ? 'Войти' : 'Создать аккаунт';
            toggleAuth.innerText = isLogin ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) { 
                    alert(data.error || 'Ошибка авторизации'); 
                    return; 
                }

                if (isLogin) {
                    localStorage.setItem('jwt_token', data.token);
                    // Перенаправляем строго внутрь закрытого кабинета
                    window.location.href = '/dashboard.html';
                } else {
                    alert('Регистрация успешна! Теперь вы можете войти.');
                    isLogin = true;
                    // Возвращаем интерфейс формы в режим входа
                    authTitle.innerHTML = 'Вход в платформу АРК ' + loginSvg;
                    submitBtn.innerText = 'Войти';
                    toggleAuth.innerText = 'Нет аккаунта? Зарегистрироваться';
                }
            } catch (err) { 
                alert('Ошибка сети: не удалось связаться с Go-сервером'); 
            }
        });
    </script>
  </body>
</html>
